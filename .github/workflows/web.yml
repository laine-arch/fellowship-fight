name: Test and deploy web build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Lobby server tests
        working-directory: server
        run: npm ci && npm test
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path game --editor --quit
      - name: Sim parity with the web version (must print identical state)
        run: |
          for seed in 42 7 2024; do
            godot --headless --path game -s res://tests/parity_run.gd -- 6000 $seed | grep -v '^Godot Engine' | grep -v '^$' > gd.txt
            node tools/parity/js_run.mjs 6000 $seed > js.txt
            diff js.txt gd.txt
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and the web export template
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T && unzip -j -o tpl.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d $T && rm tpl.tpz
      - name: Point the game at the lobby server
        if: vars.LOBBY_SERVER_URL != ''
        run: sed -i 's#^server_url=.*#server_url="${{ vars.LOBBY_SERVER_URL }}"#' game/project.godot
      - name: Export
        run: |
          godot --headless --path game --editor --quit
          mkdir -p build/web
          godot --headless --path game --export-release "Web" ../build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }

  deploy:
    # publish only from the repository's default branch
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
